openapi: 3.0.0
info:
  title: Sales Order DDD API
  description: |
    Sales Order Processing API — Domain-Driven Design, Hexagonal Architecture, and CQRS on Laravel.

    ## Architectural Concepts Demonstrated
    - **DDD Domain Model**: `Sale` aggregate root + value objects (`SaleId`, `Money`, `LineItem`, `PaymentMethod`, `Commission`)
    - **Hexagonal Architecture**: Ports (`PaymentGatewayInterface`, `CommissionCalculatorInterface`, `SaleRepositoryInterface`, `SaleReadModelRepositoryInterface`) + framework adapters (Eloquent, HTTP, mock)
    - **CQRS**: Commands (write side, return `void`) vs Queries (read side, return flat DTOs / read models)
    - **Domain Events**: `SaleCreatedEvent`, `SaleConfirmedEvent`, `SaleCompletedEvent`, `SaleCancelledEvent`

    ## Sale Status Machine
    ```
    PENDING ──confirm──▶ CONFIRMED ──complete──▶ COMPLETED
       │                     
       └──cancel──▶ CANCELLED
    ```
  version: 1.2.0
  contact:
    name: Futaikhi
    url: https://futaikhi.vercel.app/

servers:
  - url: http://localhost:8000/api
    description: Local Development

tags:
  - name: Customers
    description: Customer management endpoints (referenced by Sales)
  - name: Products
    description: Product management endpoints (referenced by Sales line items)
  - name: Sales - Commands
    description: |
      Write-side (CQRS Commands). Return `void` — only a status message.
      To see the resulting state, call the corresponding Query endpoint.
  - name: Sales - Queries
    description: |
      Read-side (CQRS Queries). Return flat read models (`SaleDetailRM`, `SaleListItemRM`, ...),
      never write-side aggregates. Optimized for display; may safely join data across contexts.
  - name: Sales - Reports
    description: Aggregated read models (revenue per day, commission per day).

paths:

  # ─────────────────────────────────────────────────────────────
  # Customers
  # ─────────────────────────────────────────────────────────────
  /customers:
    post:
      summary: Create a new customer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone]
              properties:
                name:  { type: string, example: "PT Maju Jaya" }
                email: { type: string, format: email, example: "contact@majujaya.com" }
                phone: { type: string, example: "021-555-1234" }
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:      { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAV", description: "ULID" }
                  message: { type: string, example: "Customer created successfully" }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────────────────────────────────────────
  # Products
  # ─────────────────────────────────────────────────────────────
  /products:
    post:
      summary: Create a new product
      description: |
        Price stored in minor units (e.g. rupiah cents). Product price is the source of truth
        for `LineItem.unitPrice` inside a Sale.
      tags: [Products]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sku, price, currency]
              properties:
                name:     { type: string,  example: "Laptop Dell XPS 15" }
                sku:      { type: string,  example: "DEL-XPS15-2024" }
                price:    { type: integer, example: 15000000, description: "Price in minor units (rupiah cents)" }
                currency: { type: string,  example: "IDR" }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:      { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAW" }
                  message: { type: string, example: "Product created successfully" }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────────────────────────────────────────
  # Sales - Commands (write side)
  # ─────────────────────────────────────────────────────────────
  /sales:
    post:
      summary: Create sales order (PENDING)
      description: |
        Creates a Sale aggregate in status `PENDING`. Enforced business rules (domain layer):
        - Minimum order amount: **50,000**
        - Maximum line items: **20**
        - Every line item must have quantity ≥ 1 and unit price ≥ 1
        - Customer & Product must exist

        **Aggregate:** `Sale`  
        **Command:** `CreateSaleCommand`  
        **Handler:** `CreateSaleHandler`
      tags: [Sales - Commands]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer_id, line_items]
              properties:
                customer_id:
                  type: string
                  example: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
                line_items:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAW" }
                      quantity:   { type: integer, minimum: 1, example: 2 }
      responses:
        '201':
          description: Sale created (status PENDING)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX", description: "ULID assigned to the sale" }
                  invoice_number: { type: string, nullable: true, example: "INV-20260910-0001", description: "Human-readable, backend-generated invoice number. Format INV-YYYYMMDD-NNNN. Persisted and unique." }
                  message: { type: string, example: "Sale created successfully" }
        '404':
          description: |
            `404 Not Found` — Referenced `customer_id` or one of the `product_id`s
            does not exist. Handled by `CustomerNotFoundException` /
            `ProductNotFoundException`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                customer:
                  value: { error: "customer_not_found", message: "Customer 01ARZ3NDEKTSV4RRFFQ69G5FAV was not found." }
                product:
                  value: { error: "product_not_found",  message: "Product 01ARZ3NDEKTSV4RRFFQ69G5FAW was not found." }
        '422': { $ref: '#/components/responses/ValidationError' }

    # ─────────────────────────────────────────────────────────────
    # CSV bulk import
    # ─────────────────────────────────────────────────────────────

    get:
      summary: List sales (paginated, filterable)
      description: |
        **CQRS Query** — returns a `PaginatedCollection<SaleListItemRM>` (flat read model, not aggregates).

        **Query:** `ListSalesQuery`  
        **Handler:** `ListSalesHandler`  
        **Read port:** `SaleReadModelRepositoryInterface::paginate()`
      tags: [Sales - Queries]
      parameters:
        - { name: customer_id, in: query, schema: { type: string }, description: "Filter by customer ULID" }
        - { name: status,      in: query, schema: { $ref: '#/components/schemas/OrderStatus' }, description: "Filter by sale status" }
        - { name: date_from,   in: query, schema: { type: string, example: "2026-08-01 00:00:00" } }
        - { name: date_to,     in: query, schema: { type: string, example: "2026-08-31 23:59:59" } }
        - { name: limit,       in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
        - { name: offset,      in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Paginated list of sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SaleListItemRM' }
                  pageSize:   { type: integer, example: 20 }
                  page:       { type: integer, example: 1 }
                  totalCount: { type: integer, example: 87 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sales/import-csv:
    post:
      summary: Bulk-create sales from a CSV file
      description: |
        Uploads a CSV file that contains **one line-item row per line**. Rows are grouped by the
        `import_ref` column into individual `Sale` aggregates (one aggregate per group).

        For each successfully created sale, the backend:
          * generates a fresh `SaleId` (ULID)
          * generates a permanent, human-readable `invoice_number` (`INV-YYYYMMDD-NNNN`)
          * dispatches the same `CreateSaleCommand` used by the JSON endpoint (`POST /sales`)

        The `import_ref` column is a **temporary grouping key only** — it is never stored in the
        database. Use it in the CSV to indicate which rows belong to the same sale.

        ### CSV format

        Header row is required. Column order does not matter, but names must match exactly:

        ```
        import_ref,customer_id,product_id,quantity
        sale-001,01H8M6KJ5NQ8XX4P0N2VYJ4K5A,01H8M6KJ5NQ8XX4P0N2VYJ4P01,2
        sale-001,01H8M6KJ5NQ8XX4P0N2VYJ4K5A,01H8M6KJ5NQ8XX4P0N2VYJ4P02,1
        sale-002,01H8M6KJ5NQ8XX4P0N2VYJ4K5B,01H8M6KJ5NQ8XX4P0N2VYJ4P01,1
        ```

        ### Row-level rules
        * All rows sharing the same `import_ref` **must** use the same `customer_id`.
        * `product_id` must be **unique within a single `import_ref` group** (no duplicate lines).
        * `quantity` must be an integer `>= 1`.
        * All domain-level rules from `POST /sales` apply (min amount, max 20 line items, existing customer/product).

        ### Failure strategy
        **Fail entire import**: if any row is invalid (bad format, unknown customer, unknown product,
        duplicate product within a group, mismatched customer_id, domain rule violation, etc.) — no
        sales are persisted and `422 Unprocessable Entity` is returned with a per-row error list.

        **Command dispatched (per group):** `CreateSaleCommand`
        **Action:** `Apps\Api\Sales\ImportCsv\ImportSalesCsvAction`
      tags: [Sales Commands]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "CSV file (text/csv or text/plain). Max 2048 KB."
      responses:
        '201':
          description: All groups were valid and every sale was created successfully.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesCsvImportResponse' }
              example:
                total_rows: 6
                created_sales: 3
                failed_rows: 0
                sales:
                  - { import_ref: "sale-001", sale_id: "01J...", invoice_number: "INV-20260910-0001" }
                  - { import_ref: "sale-002", sale_id: "01J...", invoice_number: "INV-20260910-0002" }
                  - { import_ref: "sale-003", sale_id: "01J...", invoice_number: "INV-20260910-0003" }
                errors: []
        '422':
          description: |
            At least one row failed validation. No sales were persisted. The `errors` array
            enumerates every offending row (row number is 1-based, header row is row 1).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesCsvImportResponse' }
              example:
                total_rows: 6
                created_sales: 0
                failed_rows: 2
                sales: []
                errors:
                  - { row: 3, import_ref: "sale-001", field: "customer_id", message: "All rows sharing the same import_ref must use the same customer_id." }
                  - { row: 5, import_ref: "sale-002", field: "product_id",  message: "Duplicate product_id within the same import_ref is not allowed." }


  /sales/{id}:
    get:
      summary: Get sale detail
      description: |
        **CQRS Query** — returns a flat `SaleDetailRM` (never a write-side aggregate).

        **Query:** `GetSaleByIdQuery`  
        **Handler:** `GetSaleByIdHandler`  
        **Read port:** `SaleReadModelRepositoryInterface::findDetail()`
      tags: [Sales - Queries]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX" } }
      responses:
        '200':
          description: Sale detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleDetailRM' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sales/{id}/confirm:
    post:
      summary: Confirm sale (PENDING → CONFIRMED)
      description: |
        Orchestrates the confirmation:
        1. Load the aggregate
        2. Call `PaymentGatewayInterface::process()` (hexagonal port)
        3. On success, transition aggregate to `CONFIRMED` and lock the payment info
        4. Persist and publish `SaleConfirmedEvent`

        **Command:** `ConfirmSaleCommand(SaleId, PaymentMethod)`  
        **Handler:** `ConfirmSaleHandler` (injects `SaleRepositoryInterface`, `PaymentGatewayInterface`)

        On payment failure the aggregate **stays PENDING** and the API returns **402 Payment Required**.
      tags: [Sales - Commands]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method:
                  $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: Sale confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleActionResponse' }
        '402': { $ref: '#/components/responses/PaymentFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidSaleState' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502': { $ref: '#/components/responses/PaymentGatewayError' }

  /sales/{id}/complete:
    post:
      summary: Complete sale (CONFIRMED → COMPLETED)
      description: |
        Orchestrates completion + commission calculation:
        1. Load the aggregate
        2. Call `CommissionCalculatorInterface::calculate($sale)` (hexagonal port)
        3. Transition to `COMPLETED` and lock the returned `Commission` value object
        4. Persist and publish `SaleCompletedEvent`

        **Commission rules** (see `DatabaseCommissionService`):
        - `total_amount > 1,000,000` → **5%**
        - otherwise → **3%**

        **Command:** `CompleteSaleCommand`  
        **Handler:** `CompleteSaleHandler` (injects `SaleRepositoryInterface`, `CommissionCalculatorInterface`)
      tags: [Sales - Commands]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX" } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Sale completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleActionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidSaleState' }

  /sales/{id}/cancel:
    post:
      summary: Cancel sale (PENDING || CONFIRMED → CANCELLED)
      description: |
        Allowed only from `PENDING`. `CONFIRMED`, `COMPLETED`, and `CANCELLED` sales cannot be cancelled.

        **Command:** `CancelSaleCommand(SaleId, reason)`  
        **Handler:** `CancelSaleHandler`
      tags: [Sales - Commands]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, example: "Customer requested cancellation" }
      responses:
        '200':
          description: Sale cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleActionResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidSaleState' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────────────────────────────────────────────
  # Sales - Reports (aggregated queries)
  # ─────────────────────────────────────────────────────────────
  /sales/reports/sales:
    get:
      summary: Daily sales report
      description: |
        Returns per-day revenue for `COMPLETED` sales in the given range.

        **Query:** `GetSalesReportQuery(from, to)`  
        **Handler:** `GetSalesReportHandler`  
        **Read port:** `SaleReadModelRepositoryInterface::salesReport()`
      tags: [Sales - Reports]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, example: "2026-08-01 00:00:00" } }
        - { name: to,   in: query, required: true, schema: { type: string, example: "2026-08-31 23:59:59" } }
      responses:
        '200':
          description: Aggregated per-day sales report
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SalesReportRM' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /sales/reports/commissions:
    get:
      summary: Daily commission summary
      description: |
        Returns per-day commission totals for `COMPLETED` sales.

        **Query:** `GetCommissionSummaryQuery(from, to)`  
        **Handler:** `GetCommissionSummaryHandler`  
        **Read port:** `SaleReadModelRepositoryInterface::commissionSummary()`
      tags: [Sales - Reports]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, example: "2026-08-01 00:00:00" } }
        - { name: to,   in: query, required: true, schema: { type: string, example: "2026-08-31 23:59:59" } }
      responses:
        '200':
          description: Aggregated per-day commission summary
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CommissionSummaryRM' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:

  schemas:

    # ── Enums / small value objects
    OrderStatus:
      type: string
      enum: [pending, confirmed, completed, cancelled]

    PaymentMethod:
      type: string
      description: |
        Whitelisted payment methods. Backed by `Src\Sales\Domain\Enums\PaymentMethod`.
        Case-insensitive on input; always lowercase on output.
      enum: [credit_card, bank_transfer, e_wallet, cash]
      example: credit_card

    # ── Common success payload for command endpoints
    SaleActionResponse:
      type: object
      properties:
        message: { type: string, example: "Sale confirmed successfully" }

    # ── Read models (CQRS - Query side)
    SaleLineItemRM:
      type: object
      properties:
        productId: { type: string,  example: "01ARZ3NDEKTSV4RRFFQ69G5FAW" }
        quantity:  { type: integer, example: 2 }
        unitPrice: { type: integer, example: 15000000, description: "Minor units" }
        currency:  { type: string,  example: "IDR" }
        lineTotal: { type: integer, example: 30000000 }

    SaleListItemRM:
      type: object
      properties:
        id: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX" }
        invoiceNumber: { type: string, nullable: true, example: "INV-20260910-0001", description: "Backend-generated invoice number. Nullable for legacy sales created before the feature was added." }
        customerId: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAV" }
        status: { $ref: '#/components/schemas/OrderStatus' }
        totalAmount: { type: integer, example: 30500000 }
        currency: { type: string, example: "IDR" }
        createdAt: { type: string, example: "2026-08-15 10:12:00" }

    SaleDetailRM:
      type: object
      properties:
        id: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAX" }
        invoiceNumber: { type: string, nullable: true, example: "INV-20260910-0001", description: "Backend-generated invoice number." }
        customerId: { type: string, example: "01ARZ3NDEKTSV4RRFFQ69G5FAV" }
        status: { $ref: '#/components/schemas/OrderStatus' }
        totalAmount:        { type: integer, example: 30500000 }
        currency:           { type: string,  example: "IDR" }
        lineItems:
          type: array
          items: { $ref: '#/components/schemas/SaleLineItemRM' }
        paymentMethod:      { type: string,  nullable: true, example: "credit_card" }
        transactionId:      { type: string,  nullable: true, example: "MOCK-1a2b3c4d5e6f7080" }
        commissionAmount:   { type: integer, nullable: true, example: 915000, description: "Minor units" }
        commissionRate:     { type: number,  nullable: true, example: 3.0 }
        commissionCurrency: { type: string,  nullable: true, example: "IDR" }
        createdAt:          { type: string,  example: "2026-08-15 10:12:00" }
        confirmedAt:        { type: string,  nullable: true, example: "2026-08-15 10:15:22" }
        completedAt:        { type: string,  nullable: true, example: "2026-08-15 11:30:00" }
        cancelledAt:        { type: string,  nullable: true, example: null }
        cancellationReason: { type: string,  nullable: true, example: null }

    SalesReportRM:
      type: object
      properties:
        date:         { type: string,  example: "2026-08-15" }
        salesCount:   { type: integer, example: 42 }
        revenueTotal: { type: integer, example: 1234500000, description: "Sum of total_amount (minor units)" }
        currency:     { type: string,  example: "IDR" }

    CommissionSummaryRM:
      type: object
      properties:
        date:                { type: string,  example: "2026-08-15" }
        completedSalesCount: { type: integer, example: 42 }
        totalCommission:     { type: integer, example: 37035000, description: "Sum of commission_amount (minor units)" }
        currency:            { type: string,  example: "IDR" }

    # ── CSV Import response (POST /sales/import-csv) ──
    SalesCsvImportResponse:
      type: object
      description: >
        Response body returned by `POST /sales/import-csv`. On success (201) all rows
        were valid and every sale was persisted. On failure (422) no sales were
        persisted (fail-entire-import strategy) and `errors[]` lists every offending row.
      required: [total_rows, created_sales, failed_rows, sales, errors]
      properties:
        total_rows:
          type: integer
          example: 6
          description: "Total number of data rows read from the CSV (excluding the header)."
        created_sales:
          type: integer
          example: 3
          description: "Number of Sale aggregates created (unique `import_ref` groups). 0 on 422."
        failed_rows:
          type: integer
          example: 0
          description: "Number of rows that failed validation. Non-zero implies 422 and no sales were created."
        sales:
          type: array
          description: "Created sales (empty on 422). One entry per unique `import_ref`."
          items:
            type: object
            required: [import_ref, sale_id, invoice_number]
            properties:
              import_ref:
                type: string
                example: "sale-001"
                description: "Grouping key from the CSV. Not persisted."
              sale_id:
                type: string
                format: ulid
                example: "01ARZ3NDEKTSV4RRFFQ69G5FAV"
              invoice_number:
                type: string
                example: "INV-20260910-0001"
                description: "Backend-generated invoice number (format INV-YYYYMMDD-NNNN)."
        errors:
          type: array
          description: "Per-row validation errors. Empty on 201."
          items:
            type: object
            required: [row, message]
            properties:
              row:
                type: integer
                example: 3
                description: "1-based CSV row number (header is row 1, first data row is row 2)."
              import_ref:
                type: string
                nullable: true
                example: "sale-002"
                description: "The `import_ref` cell for that row, if it could be read."
              field:
                type: string
                nullable: true
                example: "quantity"
                description: "Name of the offending column, if the failure is scoped to one field."
              message:
                type: string
                example: "quantity must be a positive integer"

    # ── Error envelope (returned by exception handlers in bootstrap/app.php)
    ErrorEnvelope:
      type: object
      properties:
        error:   { type: string }
        message: { type: string }

  responses:

    ValidationError:
      description: |
        `422 Unprocessable Entity` — Request payload is well-formed but semantically invalid
        (missing required fields, unknown enum value, malformed ULID, invalid date, etc.).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          examples:
            missing_field:
              value: { error: "validation_failed", message: "payment_method is required" }
            unknown_enum:
              value: { error: "validation_failed", message: "Invalid payment method 'bitcoin'. Allowed: credit_card, bank_transfer, e_wallet, cash." }

    PaymentFailed:
      description: |
        `402 Payment Required` — The payment gateway rejected the payment (e.g. insufficient funds,
        card declined). The sale remains in `PENDING`; the client can retry with a different method.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: "payment_failed"
            message: "Insufficient funds"

    PaymentGatewayError:
      description: |
        `502 Bad Gateway` — The local payment validation adapter raised an unexpected infrastructure error.
        The sale remains in `PENDING`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: "payment_gateway_error"
            message: "Payment validation error: unexpected adapter failure"

    NotFound:
      description: '`404 Not Found` — Sale does not exist.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: "sale_not_found"
            message: "Sale with id 01ARZ3NDEKTSV4RRFFQ69G5FAX was not found"

    InvalidSaleState:
      description: |
        `409 Conflict` — The requested transition is not allowed from the current status.
        Examples: confirming an already-CONFIRMED sale, completing a PENDING sale,
        cancelling a COMPLETED sale.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
          example:
            error: "invalid_sale_state"
            message: "Sale cannot be confirmed: status is 'completed'"
